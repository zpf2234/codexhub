name: Discover candidates

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCOVERY_MAX_REPOSITORIES: 50
          GITHUB_DISCOVERY_TIMEOUT_MS: 10000
          GITHUB_DISCOVERY_RETRIES: 1
          MCP_REGISTRY_MAX_PAGES: 20
          DISCOVERY_MAX_SOURCES_PER_RUN: 3
          DISCOVERY_SCAN_CONCURRENCY: 4
      - run: npm run build:cached
      - name: Commit discovery dataset
        run: |
          if [ -z "$(git status --porcelain -- artifacts/discovery)" ]; then exit 0; fi
          git config user.name "codexhub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/discovery/checkpoint.json artifacts/discovery/discovery.json artifacts/discovery/repositories.json artifacts/discovery/artifacts.json artifacts/discovery/coverage.json artifacts/discovery/errors.json
          git commit -m "chore: refresh discovery dataset"
          git push
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codexhub-discovery-candidates
          path: |
            artifacts/discovery
            dist/api/v1/discovery
          retention-days: 14
