name: Discover candidates

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codexhub-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run discover
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCOVERY_MAX_REPOSITORIES: 1000
          DISCOVERY_MAX_ARTIFACTS_PER_REPOSITORY: 0
          GITHUB_DISCOVERY_TIMEOUT_MS: 10000
          GITHUB_DISCOVERY_RETRIES: 2
          GITHUB_DISCOVERY_MAX_SEGMENTS_PER_RUN: 8
          MCP_REGISTRY_MAX_PAGES: 25
          MCP_REGISTRY_TIMEOUT_MS: 8000
          DISCOVERY_MAX_SOURCES_PER_RUN: 2
          DISCOVERY_SCAN_CONCURRENCY: 8
      - run: npm run build:cached
      - name: Commit discovery dataset
        run: |
          if [ -z "$(git status --porcelain -- artifacts/discovery)" ]; then exit 0; fi
          git config user.name "codexhub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/discovery/checkpoint.json artifacts/discovery/discovery.json artifacts/discovery/repositories.json artifacts/discovery/artifacts.json artifacts/discovery/coverage.json artifacts/discovery/errors.json
          git commit -m "chore: refresh discovery dataset"
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          echo "Unable to push discovery dataset after five attempts." >&2
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codexhub-discovery-candidates
          path: |
            artifacts/discovery
            dist/api/v1/discovery
          retention-days: 14
