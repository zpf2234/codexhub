name: Refresh catalog

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run refresh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit refreshed metadata
        run: |
          if git diff --quiet -- catalog/cache/github.json; then exit 0; fi
          git config user.name "codexhub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog/cache/github.json
          git commit -m "chore: refresh catalog metadata"
          git push
