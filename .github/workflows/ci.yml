name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:offline
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Verify deterministic output
        run: |
          SCAN_TIMESTAMP=2026-01-01T00:00:00.000Z npm run build:offline
          cp dist/api/v1/catalog.json /tmp/catalog.json
          SCAN_TIMESTAMP=2026-01-01T00:00:00.000Z npm run build:offline
          diff /tmp/catalog.json dist/api/v1/catalog.json
